[project]
name = "pureskillgg-datascience-showcase"
version = "0.0.8"
description = "Make PureSkill.gg-style graphics from CS2 match data."
authors = [{ name = "PureSkill.gg", email = "contact@pureskill.gg" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "imageio-ffmpeg>=0.6.0,<1.0.0",
    "jupyter>=1.1.0,<2.0.0",
    "matplotlib>=3.11.0,<4.0.0",
    "numpy>=2.4.0,<3.0.0",
    "pandas>=2.3.0,<4.0.0",
    "pillow>=12.0.0,<13.0.0",
    "pureskillgg-dsdk>=4.0.1,<5.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "seaborn>=0.13.2,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/pureskillgg/datascience-showcase"
Repository = "https://github.com/pureskillgg/datascience-showcase"

[dependency-groups]
dev = [
    "black>=26.0.0,<27.0.0",
    "nbstripout>=0.9.0,<1.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pylint>=4.0.0,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-watch>=4.2.0,<5.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "pureskillgg_datascience_showcase"

[tool.black]
line-length = 110
target-version = ["py314"]

[tool.pylint.format]
max-line-length = 110

[tool.pylint."messages control"]
disable = ["too-many-arguments", "too-many-locals", "too-many-instance-attributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
